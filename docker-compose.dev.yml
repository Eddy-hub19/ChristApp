name: christapp-dev

x-database-url: &database-url
  DATABASE_URL: postgresql://${DB_USERNAME}:${DB_PASSWORD}@db:5432/${DB_DATABASE}

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE}
    volumes: [db_data:/var/lib/postgresql]
    ports: ['127.0.0.1:${DB_PORT:-5432}:5432']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [internal]

  backend:
    restart: unless-stopped
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
      target: production
    env_file: [.env.development]
    environment:
      <<: *database-url
      NODE_ENV: production
      PORT: '3001'
    command: sh -c "npm run db:migrate && exec node dist/src/main.js"
    ports: ['127.0.0.1:${BACKEND_PORT:-3001}:3001']
    volumes: [backend_uploads:/repo/apps/backend/uploads]
    depends_on:
      db: { condition: service_healthy }
    networks: [internal]

  web:
    restart: unless-stopped
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: production
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-}
        NEXT_PUBLIC_SOCKET_PATH: ${NEXT_PUBLIC_SOCKET_PATH:-}
        NEXT_PUBLIC_USE_DIRECT_API: ${NEXT_PUBLIC_USE_DIRECT_API:-}
        NEXT_PUBLIC_BIBLE_API_URL: ${NEXT_PUBLIC_BIBLE_API_URL:-}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-}
        NEXT_PUBLIC_AGORA_APP_ID: ${NEXT_PUBLIC_AGORA_APP_ID:-}
        NEXT_PUBLIC_GTM_ID: ${NEXT_PUBLIC_GTM_ID:-}
        BACKEND_PROXY_TARGET: http://backend:3001
    env_file: [.env.development]
    environment:
      NODE_ENV: production
      PORT: '3000'
      BACKEND_PROXY_TARGET: http://backend:3001
    ports: ['127.0.0.1:${FRONTEND_PORT:-3000}:3000']
    depends_on:
      backend: { condition: service_healthy }
    networks: [internal]

volumes:
  db_data:
  backend_uploads:

networks:
  internal:
