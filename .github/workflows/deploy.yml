name: Deploy

on:
  push:
    tags: ['v*']

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      IMAGE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: npm run docker:push
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
          NEXT_PUBLIC_WS_URL: ${{ vars.NEXT_PUBLIC_WS_URL }}
          NEXT_PUBLIC_SOCKET_PATH: ${{ vars.NEXT_PUBLIC_SOCKET_PATH }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_AGORA_APP_ID: ${{ vars.NEXT_PUBLIC_AGORA_APP_ID }}
          GIT_COMMIT_SHA: ${{ github.sha }}
          BUILDX_FLAGS: --set *.cache-from=type=gha --set *.cache-to=type=gha,mode=max
      - name: Production env and SSH access
        run: |
          printf '%s\n' "${{ secrets.PRODUCTION_ENV }}" > .env.production
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - run: npm run docker:prod:deploy
        env:
          DOCKER_HOST: ssh://${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
      - run: curl -fsS --retry 5 --retry-delay 5 "https://$(grep '^API_HOST=' .env.production | cut -d= -f2)/v1/api/health"
