name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

jobs:
  frontend:
    name: Frontend (tsc, eslint, tests, next build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Type check
        run: npm exec --workspace @christapp/web -- tsc --noEmit
      - name: ESLint
        continue-on-error: true
        run: npm run lint --workspace @christapp/web
      - name: Unit tests
        run: npm test --workspace @christapp/web
      - name: next build
        run: npm run build --workspace @christapp/web

  backend:
    name: Backend (nest build, eslint, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: nest build
        run: npm run build --workspace @christapp/backend
      - name: ESLint
        continue-on-error: true
        run: npm exec --workspace @christapp/backend -- eslint .
      - name: Unit tests
        run: npm test --workspace @christapp/backend

  migrations:
    name: Prisma migrations (empty database)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: migrate deploy on an empty database
        working-directory: apps/backend
        run: npx prisma migrate deploy
      - name: Database matches schema.prisma
        working-directory: apps/backend
        run: npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code

  images:
    name: Docker images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Build images
        run: npm run docker:build
        env:
          IMAGE_TAG: ci
