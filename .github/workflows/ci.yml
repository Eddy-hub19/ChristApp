name: CI

# Каждый PR и каждый push в main: сборка фронтенда и бэкенда, типы, линт, тесты.
# Красный крестик на PR означает, что ветку не соберут Vercel / Render.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # postinstall бэкенда (`prisma generate`) требует переменную, но к базе не подключается.
  DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

jobs:
  frontend:
    name: Frontend (tsc, eslint, tests, next build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      # Монорепо с workspaces и ОДНИМ корневым package-lock.json: ставим один раз в корне.
      - name: Install (root, npm ci)
        run: npm ci --no-audit --no-fund

      - name: Type check
        run: npm exec --workspace frontend -- tsc --noEmit

      # В проекте уже есть ошибки правил React Compiler (на сборку не влияют):
      # пока их не починят, линт показывает их предупреждением, но не краснит PR.
      - name: ESLint
        continue-on-error: true
        run: npm run lint --workspace frontend

      - name: Unit tests
        run: npm test --workspace frontend

      - name: next build
        run: npm run build --workspace frontend

  backend:
    name: Backend (nest build, eslint, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install (root, npm ci)
        run: npm ci --no-audit --no-fund

      - name: nest build
        run: npm run build --workspace backend

      # В бэкенде есть старые ошибки линта (scripts/verify-vapid.js, upload-policy.ts):
      # предупреждение, не краснит PR, пока их не починят.
      - name: ESLint
        continue-on-error: true
        run: npm exec --workspace backend -- eslint .

      - name: Unit tests
        run: npm test --workspace backend

  # Регресія: `prisma migrate deploy` на ПОРОЖНІЙ базі має відтворювати рівно schema.prisma
  # (див. backend/prisma/MIGRATIONS.md).
  migrations:
    name: Prisma migrations (empty database)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install (root, npm ci)
        run: npm ci --no-audit --no-fund

      - name: migrate deploy on an empty database
        working-directory: backend
        run: npx prisma migrate deploy

      - name: Database matches schema.prisma
        working-directory: backend
        run: npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code
